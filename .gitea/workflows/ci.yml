name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: git.gamebois.lol
  HUSKY: 0
  # pnpm 12 fails an install on any unapproved build script. esbuild's only
  # checks its platform binary, which ships as an optional dep; nothing needs it.
  # A pnpm-workspace.yaml of the repo's own would take it out of the studio
  # workspace, so the approval lives here.
  pnpm_config_allow_builds: '{"esbuild":false}'
  # The studio exempts its own registry from the one-day release-age gate, so a
  # fresh engine patch installs at once; a standalone install never reads that
  # root setting, so it's restated here.
  pnpm_config_minimum_release_age_exclude: '["@open-loop/*"]'

jobs:
  deploy:
    runs-on: linux
    container:
      image: node:24-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable

      # The engine installs from the studio registry, which needs auth.
      - name: Registry auth
        run: |
          cat <<EOF > ~/.npmrc
          @open-loop:registry=https://${{ env.REGISTRY }}/api/packages/studio/npm/
          //${{ env.REGISTRY }}/api/packages/studio/npm/:_authToken=${{ secrets.REGISTRY_TOKEN_STUDIO }}
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Circular imports
        run: pnpm circular

      - name: Build
        run: pnpm build
        env:
          BASE_URL: /

      # aws-cli, not mc: MinIO no longer publishes a community mc build.
      # The bucket policy grants anonymous GetObject only — no listing.
      - name: Deploy to Pages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_PAGES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_PAGES_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://192.168.50.192:9000
        run: |
          apk add --no-cache aws-cli
          aws configure set default.s3.addressing_style path

          REPO_NAME=$(echo "${{ gitea.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          BUCKET="pages-${REPO_NAME}"

          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$BUCKET"
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::${BUCKET}/*\"]}]}"
          aws s3 sync --delete --no-progress dist/ "s3://${BUCKET}/"

          echo "Deployed to https://${REPO_NAME}.pages.gamebois.lol"

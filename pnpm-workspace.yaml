# The engine's registry, stated here because it overrides a user-level ~/.npmrc
# that maps @open-loop elsewhere.
registries:
  '@open-loop': https://registry.npmjs.org/

# A fresh engine release installs at once, so an engine fix and the consumer
# change that needs it can land together.
minimumReleaseAgeExclude:
  - '@open-loop/*'

allowBuilds:
  # The script only checks the platform binary, which ships as an optional dep.
  esbuild: false
